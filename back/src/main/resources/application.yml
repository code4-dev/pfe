server:
  port: ${SERVER_PORT:8080}

spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pfe_db}
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-secret-key-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

notification:
  delai-jours: ${NOTIFICATION_DELAI_JOURS:3}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}
